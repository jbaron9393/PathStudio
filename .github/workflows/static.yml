# Deploy the front-end-only static preview to GitHub Pages.
name: Deploy static preview to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static preview
        run: |
          set -euo pipefail
          mkdir -p _site
          cp cap_cloze_refiner.html _site/index.html
          cp cap_synoptic_generator.html _site/cap_synoptic_generator.html
          cp script.js _site/script.js
          cp favicon.svg _site/favicon.svg
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
